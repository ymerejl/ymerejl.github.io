# Temporary helper: opens the live preview in Chrome and commits screenshots (removed afterwards).
name: check-live
on:
  push:
    branches: [claude/sweet-noether-py50gr]
    paths: [_check/check.js, .github/workflows/check-live.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sleep 75
      - run: npm i --no-save playwright@1.49.1 && npx playwright install chrome
      - run: node _check/check.js | tee _check/result.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add _check && git commit -m "Live check results (temporary)" && git push
