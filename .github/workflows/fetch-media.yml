# Temporary helper: downloads the generated media listed in _media/raw.txt, converts them to compact
# working copies (PNG -> JPEG q92, MP4 -> H.264 CRF 14) and commits them to the branch (removed afterwards).
name: fetch-media
on:
  push:
    branches: [claude/sweet-noether-py50gr]
    paths: [_media/raw.txt, .github/workflows/fetch-media.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and convert
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p _media/raw
          grep -v '^#' _media/raw.txt | while read -r name url; do
            [ -z "$name" ] && continue
            [ -f "_media/raw/$name" ] && continue
            curl -fsSL --retry 3 "$url" -o "/tmp/src.bin"
            case "$name" in
              *.jpg) ffmpeg -nostdin -loglevel error -y -i /tmp/src.bin -q:v 2 "_media/raw/$name" ;;
              *.mp4) ffprobe -v error -show_entries stream=width,height,r_frame_rate,nb_frames -of csv=p=0 /tmp/src.bin
                     ffmpeg -nostdin -loglevel error -y -i /tmp/src.bin -an -c:v libx264 -preset slow -crf 14 -pix_fmt yuv420p "_media/raw/$name" ;;
            esac
            ls -la "_media/raw/$name"
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add _media/raw
          git diff --cached --quiet && exit 0
          git commit -m "Add fetched media (temporary)"
          git push
