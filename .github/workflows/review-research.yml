# Temporary research run: supplier pages for Google review stands + review link check (removed afterwards).
name: review-research
on:
  push:
    branches: [claude/sweet-noether-py50gr]
    paths: [.github/research/review.mjs, .github/workflows/review-research.yml]
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read pages
        run: |
          cp .github/research/review.mjs .
          npm i --no-save playwright@1.55.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          node review.mjs || true
          ls -la _research
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add _research
          git diff --cached --quiet && exit 0
          git commit -m "Add review stand research output (temporary)"
          git push
