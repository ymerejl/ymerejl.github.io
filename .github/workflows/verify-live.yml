# Temporary: checks the live, password-protected preview in a real browser (removed afterwards).
name: verify-live
on:
  push:
    branches: [claude/sweet-noether-py50gr]
    paths: [.github/workflows/verify-live.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live page
        run: |
          curl -sS -D headers.txt -o live.html https://ymerejl.github.io/besart/
          head -n 12 headers.txt
          echo "size: $(wc -c < live.html)"
          echo "sha256 live:     $(sha256sum live.html | cut -d' ' -f1)"
          echo "sha256 expected: cd490fa37e2fbce1b4e72d74083a085eaee655c1a0736012353c3d3c1f9c2403"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unlock with password in Chromium
        run: |
          npm i --no-save playwright@1.55.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > t.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const p = await b.newPage({ viewport: { width: 1440, height: 900 } });
          const errs = []; p.on('pageerror', e => errs.push(e.message)); p.on('console', m => { if (m.type() === 'error') errs.push(m.text()); });
          await p.goto('https://ymerejl.github.io/besart/', { waitUntil: 'load' });
          console.log('gate visible:', await p.isVisible('#pw'));
          await p.fill('#pw', '000'); await p.press('#pw', 'Enter'); await p.waitForTimeout(1500);
          console.log('wrong password message:', await p.textContent('#msg'));
          const t = Date.now();
          await p.fill('#pw', '123'); await p.press('#pw', 'Enter');
          await p.waitForSelector('#hero', { timeout: 20000, state: 'attached' });
          console.log('unlocked in ms:', Date.now() - t);
          await p.waitForTimeout(7000);
          const r = await p.evaluate(() => ({ intro: !!document.getElementById('intro'), heroReady: document.getElementById('hero').className, services: document.querySelectorAll('.svc').length, broken: [...document.images].filter(i => i.complete && !i.naturalWidth).length, h1: document.querySelector('.h1').textContent.trim() }));
          console.log('page state:', JSON.stringify(r));
          console.log('errors:', JSON.stringify(errs));
          await b.close();
          JS
          node t.mjs
