# Temporary: checks the live, password-protected preview in a real browser (removed afterwards).
name: verify-live
on:
  push:
    branches: [claude/sweet-noether-py50gr]
    paths: [.github/workflows/verify-live.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the new deployment
        run: |
          want=e205fe77ddce66b6a590d4402c3e4d52c824dd587f8f75485e962be418ac9931
          for i in $(seq 1 40); do
            curl -sS -o live.html "https://ymerejl.github.io/besart/?nocache=$i$RANDOM"
            got=$(sha256sum live.html | cut -d' ' -f1)
            echo "try $i: $got size $(wc -c < live.html)"
            [ "$got" = "$want" ] && echo "live page matches the deployed file" && exit 0
            sleep 10
          done
          echo "live page does not match yet"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gate, questionnaire, intro, notes, showcase, closing and PDF in Chromium
        run: |
          npm i --no-save playwright@1.55.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > t.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          for (const [w, h, tag] of [[1440, 900, 'desktop'], [390, 844, 'mobile']]) {
            const ctx = await b.newContext({ viewport: { width: w, height: h }, acceptDownloads: true });
            const p = await ctx.newPage();
            const errs = []; p.on('pageerror', e => errs.push(e.message)); p.on('console', m => { if (m.type() === 'error') errs.push(m.text()); });
            await p.goto('https://ymerejl.github.io/besart/', { waitUntil: 'load' });
            await p.fill('#pw', '000'); await p.press('#pw', 'Enter'); await p.waitForTimeout(1500);
            console.log(tag, 'wrong password message:', await p.textContent('#msg'));
            const t = Date.now();
            await p.fill('#pw', '123'); await p.press('#pw', 'Enter');
            await p.waitForSelector('#pitch.open', { timeout: 30000 });
            console.log(tag, 'unlocked in ms:', Date.now() - t, 'questionnaire:', await p.textContent('#ptH'));
            await p.click('.pt-chip[data-v="Im Salon"]'); await p.click('#pitch [data-dir="1"]'); await p.waitForTimeout(600);
            await p.fill('#pt_salon_seit', '2019'); await p.waitForTimeout(600);
            await p.click('#ptTopBtn'); await p.waitForTimeout(1500);
            console.log(tag, 'intro running after start:', await p.evaluate(() => document.documentElement.classList.contains('intro-on')));
            await p.waitForFunction(() => !document.documentElement.classList.contains('intro-on'), null, { timeout: 20000 });
            await p.waitForTimeout(1200);
            await p.click('#ptFab'); await p.waitForTimeout(700);
            await p.fill('#ptNote', 'Live-Test Notiz');
            console.log(tag, 'note context:', await p.evaluate(() => document.getElementById('ptCtx').value));
            await p.click('.pt-x'); await p.waitForTimeout(500);
            await p.evaluate(() => { document.documentElement.style.scrollBehavior = 'auto'; scrollTo(0, document.body.scrollHeight); });
            await p.waitForTimeout(800);
            await p.click('.foot-next'); await p.waitForTimeout(1500);
            await p.evaluate(() => document.getElementById('pv5').scrollIntoView({ block: 'start' })); await p.waitForTimeout(2500);
            const s = await p.evaluate(async () => { const im = [...document.querySelectorAll('#print img')]; await Promise.all(im.map(i => i.decode().catch(() => 0))); const sp = document.querySelector('.pv-spin'); return { images: im.filter(i => i.naturalWidth).length + '/' + im.length, station: document.getElementById('pvWhere').textContent, spinReady: sp.classList.contains('is-ready') }; });
            console.log(tag, 'showcase:', JSON.stringify(s));
            await p.evaluate(() => document.getElementById('pv7').scrollIntoView({ block: 'start' })); await p.waitForTimeout(1500);
            await p.click('#pv7 [data-pitch-closing]'); await p.waitForTimeout(900);
            console.log(tag, 'closing:', await p.textContent('#ptH'));
            await p.click('#pitch [data-go="3"]:visible'); await p.waitForTimeout(700);
            await p.click('[data-act="summary"]'); await p.waitForTimeout(900);
            const [dl] = await Promise.all([p.waitForEvent('download'), p.click('[data-act="pdf"]')]);
            const path = await dl.path(); const fs = await import('fs'); const head = fs.readFileSync(path).subarray(0, 8).toString();
            console.log(tag, 'pdf:', dl.suggestedFilename(), head, fs.statSync(path).size, 'bytes');
            await p.reload(); await p.waitForSelector('#hero', { timeout: 30000, state: 'attached' }); await p.waitForTimeout(1500);
            console.log(tag, 'after reload:', JSON.stringify(await p.evaluate(() => ({ questionnaire: document.documentElement.classList.contains('pitch-hold'), notes: document.getElementById('ptFabN').textContent }))));
            console.log(tag, 'errors:', JSON.stringify(errs));
            await ctx.close();
          }
          const c2 = await b.newContext(); const q = await c2.newPage();
          await q.goto('https://ymerejl.github.io/besart/?termin'); await q.fill('#pw', '123'); await q.press('#pw', 'Enter');
          await q.waitForSelector('#hero', { timeout: 30000, state: 'attached' }); await q.waitForTimeout(3500);
          console.log('QR ?termin:', JSON.stringify(await q.evaluate(() => { const r = document.getElementById('termin').getBoundingClientRect(); return { pitchUi: document.documentElement.classList.contains('pitch'), intro: document.documentElement.classList.contains('intro-on'), bookingVisible: r.top < innerHeight && r.bottom > 0 }; })));
          await b.close();
          JS
          node t.mjs
