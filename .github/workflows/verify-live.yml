# Temporary: checks the live, password-protected preview in a real browser (removed afterwards).
name: verify-live
on:
  push:
    branches: [claude/sweet-noether-py50gr]
    paths: [.github/workflows/verify-live.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the new deployment
        run: |
          want=a0fd7615b2fb092f532dcf32e957b8bf42de63d3affa2148b7d8203557c319b5
          for i in $(seq 1 30); do
            curl -sS -o live.html "https://ymerejl.github.io/besart/?nocache=$i$RANDOM"
            got=$(sha256sum live.html | cut -d' ' -f1)
            echo "try $i: $got size $(wc -c < live.html)"
            [ "$got" = "$want" ] && echo "live page matches the deployed file" && exit 0
            sleep 10
          done
          echo "live page does not match yet"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unlock, QR target and print showcase in Chromium
        run: |
          npm i --no-save playwright@1.55.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > t.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          for (const [w, h, tag] of [[1440, 900, 'desktop'], [390, 844, 'mobile']]) {
            const ctx = await b.newContext({ viewport: { width: w, height: h } });
            const p = await ctx.newPage();
            const errs = []; p.on('pageerror', e => errs.push(e.message)); p.on('console', m => { if (m.type() === 'error') errs.push(m.text()); });
            await p.goto('https://ymerejl.github.io/besart/?termin', { waitUntil: 'load' });
            await p.fill('#pw', '000'); await p.press('#pw', 'Enter'); await p.waitForTimeout(1500);
            console.log(tag, 'wrong password message:', await p.textContent('#msg'));
            const t = Date.now();
            await p.fill('#pw', '123'); await p.press('#pw', 'Enter');
            await p.waitForSelector('#hero', { timeout: 20000, state: 'attached' });
            console.log(tag, 'unlocked in ms:', Date.now() - t);
            await p.waitForTimeout(3500);
            console.log(tag, 'QR target:', JSON.stringify(await p.evaluate(() => { const r = document.getElementById('termin').getBoundingClientRect(); return { introSkipped: !document.documentElement.classList.contains('intro-on'), bookingVisible: r.top < innerHeight && r.bottom > 0, top: Math.round(r.top) }; })));
            await p.evaluate(() => { document.documentElement.style.scrollBehavior = 'auto'; scrollTo(0, document.body.scrollHeight); });
            await p.waitForTimeout(800);
            await p.click('.foot-next'); await p.waitForTimeout(1500);
            for (let i = 0; i < 4; i++) { await p.keyboard.press('ArrowRight'); await p.waitForTimeout(900); }
            const s = await p.evaluate(async () => { const im = [...document.querySelectorAll('#print img')]; await Promise.all(im.map(i => i.decode().catch(() => 0))); return { open: document.getElementById('print').classList.contains('open'), images: im.filter(i => i.naturalWidth).length + '/' + im.length, station: document.getElementById('pvWhere').textContent }; });
            console.log(tag, 'showcase:', JSON.stringify(s));
            await p.keyboard.press('Escape'); await p.waitForTimeout(900);
            console.log(tag, 'closed again:', !(await p.evaluate(() => document.getElementById('print').classList.contains('open'))));
            console.log(tag, 'errors:', JSON.stringify(errs));
            await ctx.close();
          }
          await b.close();
          JS
          node t.mjs
