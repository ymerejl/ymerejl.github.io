<!doctype html><html><head><meta charset="utf-8">
<!-- Renderer für den Bewertungsaufsteller (three.js). Parameter per URL, siehe make.py:
     Kamera az/el/d/ty/tz/fov (+ sx/sy Objektivverschiebung), Licht key/kx/ky/kz/env/exp, shadow/ao/sm,
     pass=stand|shadow (Einzelpässe für die Montage), mirror=1 (Spiegelung), frames=N (Drehteller). -->
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 1200), H = +(q.get('h') || 1200), az = +(q.get('az') || -32), el = +(q.get('el') || 16), dist = +(q.get('d') || 470);
const bg = q.get('bg');   // hex or 'none'
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(+(q.get('dpr') || 2)); renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = +(q.get('exp') || 1.0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
if (bg && bg !== 'none') scene.background = new THREE.Color('#' + bg);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = +(q.get('env') || 0.55);
// z nach oben (wie im CAD-Modell)
THREE.Object3D.DEFAULT_UP.set(0, 0, 1);
const cam = new THREE.PerspectiveCamera(+(q.get('fov') || 24), W / H, 10, 5000); cam.up.set(0, 0, 1);
const target = new THREE.Vector3(0, +(q.get('ty') || 20), +(q.get('tz') || 70));
const a = THREE.MathUtils.degToRad(az), e = THREE.MathUtils.degToRad(el);
cam.position.set(target.x + dist * Math.sin(a) * Math.cos(e), target.y - dist * Math.cos(a) * Math.cos(e), target.z + dist * Math.sin(e));
cam.lookAt(target);
if (q.get('cx')) { cam.position.set(+q.get('cx'), +q.get('cy'), +q.get('cz')); cam.lookAt(target); }
if (q.get('sx') || q.get('sy')) cam.setViewOffset(W, H, +(q.get('sx') || 0), +(q.get('sy') || 0), W, H);
const key = new THREE.DirectionalLight(0xfff4e6, +(q.get('key') || 2.4)); key.position.set(+(q.get('kx') || -260), +(q.get('ky') || -320), +(q.get('kz') || 520)); key.castShadow = true;
key.shadow.mapSize.set(+(q.get('sm') || 4096), +(q.get('sm') || 4096)); key.shadow.camera.left = -260; key.shadow.camera.right = 260; key.shadow.camera.top = 260; key.shadow.camera.bottom = -260; key.shadow.camera.near = 10; key.shadow.camera.far = 2000; key.shadow.radius = 14; key.shadow.blurSamples = 24; key.shadow.bias = -0.0004;
scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 0.9); rim.position.set(320, 260, 300); scene.add(rim);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.ShadowMaterial({ opacity: +(q.get('shadow') || 0.34) }));
ground.receiveShadow = true; scene.add(ground);
// weicher Kontaktschatten unter dem Sockel
{ const c = document.createElement('canvas'); c.width = 512; c.height = 512; const x = c.getContext('2d');
  x.filter = 'blur(38px)'; x.fillStyle = 'rgba(0,0,0,1)'; x.beginPath(); x.roundRect(96, 150, 320, 212, 40); x.fill();
  const t = new THREE.CanvasTexture(c);
  const cs = new THREE.Mesh(new THREE.PlaneGeometry(190, 190), new THREE.MeshBasicMaterial({ map: t, transparent: true, opacity: +(q.get('ao') || 0.42), depthWrite: false }));
  cs.position.set(0, 29, 0.05); cs.userData.cs = true; scene.add(cs); }
const loader = new STLLoader();
const geo = await new Promise(r => loader.load('../besart-bewertungsaufsteller.stl', r));
geo.computeVertexNormals();
const mat = new THREE.MeshPhysicalMaterial({ color: new THREE.Color(q.get('col') ? '#' + q.get('col') : '#1b1a18'), roughness: 0.72, metalness: 0, clearcoat: 0.05, sheen: 0.4, sheenRoughness: 0.9, sheenColor: new THREE.Color('#3a3631') });
const stand = new THREE.Mesh(geo, mat); stand.castShadow = true; stand.receiveShadow = true; scene.add(stand);
// A6-Karte im Schlitz
const T = await (await fetch('card_T.json')).json();
const tex = await new THREE.TextureLoader().loadAsync('../../design/final/bewertungskarte-a6.png'); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 16;
const cardMat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85, metalness: 0 });
const card = new THREE.Mesh(new THREE.PlaneGeometry(105, 148), cardMat);
card.castShadow = true; card.receiveShadow = true;
// Karte aufrecht im Schlitz (Plattenkoordinaten), danach Neigung der Platte anwenden
const g = new THREE.Group(); g.add(card);
// NFC-Sticker (Ø 25 mm) in der Mulde auf der Rückseite
{ const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
  x.fillStyle = '#f2f0ea'; x.beginPath(); x.arc(128, 128, 128, 0, 7); x.fill();
  x.strokeStyle = '#b9b3a8'; x.lineWidth = 5; x.beginPath(); x.arc(128, 128, 96, 0, 7); x.stroke();
  x.fillStyle = '#6f685d'; x.font = '600 58px Arial'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('NFC', 128, 132);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const nfc = new THREE.Mesh(new THREE.CircleGeometry(12.5, 64), new THREE.MeshStandardMaterial({ map: t, roughness: 0.6 }));
  nfc.rotation.set(Math.PI / 2, Math.PI, 0); nfc.position.set(0, 5.5, 66); g.add(nfc); }
card.rotation.x = Math.PI / 2;  // Ebene XY -> XZ, Vorderseite zeigt nach -y
card.position.set(0, 2.4 + 0.65, 14 + 74);
const M = new THREE.Matrix4().fromArray(T.flat()).transpose();
g.applyMatrix4(M); scene.add(g);
const place = az2 => { const a2 = THREE.MathUtils.degToRad(az2); cam.position.set(target.x + dist * Math.sin(a2) * Math.cos(e), target.y - dist * Math.cos(a2) * Math.cos(e), target.z + dist * Math.sin(e)); cam.lookAt(target); };
const pass = q.get('pass');
if (q.get('mirror')) { stand.scale.z = -1; g.applyMatrix4(new THREE.Matrix4().makeScale(1, 1, -1)); ground.visible = false; key.castShadow = false; }
if (pass === 'stand') { ground.visible = false; scene.traverse(o => { if (o.userData.cs) o.visible = false; }); }
if (pass === 'shadow') { scene.traverse(o => { if (o.isMesh && o !== ground && !o.userData.cs) { o.material.colorWrite = false; o.material.depthWrite = false; } }); }
if (q.get('frames')) {
  const n = +q.get('frames'); window.__frames = [];
  for (let i = 0; i < n; i++) { place(az + i * 360 / n); renderer.render(scene, cam); window.__frames.push(renderer.domElement.toDataURL('image/png')); }
} else renderer.render(scene, cam);
document.title = 'ready';
</script></body></html>
