:root{color-scheme:dark;--bg:#0F0E0D;--ivory:#EDE6DA;--ivory-2:#BDB4A7;--ivory-3:#8A8277;--sand:#C7B593;--line:rgba(237,230,218,.1);--line-2:rgba(237,230,218,.22);--err:#E58C78;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;color:var(--ivory);font:350 16px/1.6 "Archivo","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(60% 50% at 50% 42%,rgba(199,181,147,.08),transparent 70%);pointer-events:none}
.gate{position:relative;width:min(380px,100%);display:flex;flex-direction:column;align-items:center;text-align:center;animation:in 1.2s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(18px)}}
.logo{width:min(250px,70vw);height:auto;fill:var(--ivory);margin-bottom:38px}
.eyebrow{display:inline-flex;align-items:center;gap:12px;margin:0 0 12px;font-size:11px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:var(--sand)}
.eyebrow::before,.eyebrow::after{content:"";width:22px;height:1px;background:var(--line-2)}
h1{margin:0 0 26px;font:500 34px/1.1 "Cormorant Garamond",Georgia,serif}
h1 em{font-style:italic;font-weight:400;color:var(--ivory-2)}
form{display:flex;gap:8px;width:100%}
input{flex:1;min-width:0;height:52px;padding:0 16px;border-radius:4px;border:1px solid var(--line-2);background:rgba(237,230,218,.04);color:var(--ivory);font:400 17px "Archivo",sans-serif;letter-spacing:.2em;text-align:center;transition:border-color .25s}
input::placeholder{letter-spacing:.06em;color:rgba(237,230,218,.32)}
input:focus{outline:none;border-color:var(--ivory)}
button{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 20px 0 22px;border:0;border-radius:4px;background:var(--ivory);color:var(--bg);cursor:pointer;font:500 12px "Archivo",sans-serif;letter-spacing:.18em;text-transform:uppercase;transition:background-color .3s,opacity .3s}
button:hover{background:#fff}
button svg{width:16px;height:16px;transition:transform .5s var(--ease)}
button:hover svg{transform:translateX(4px)}
button[disabled]{opacity:.55;cursor:progress}
.msg{min-height:22px;margin:14px 0 0;font-size:13px;color:var(--ivory-3)}
.msg.err{color:var(--err)}
.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.foot{position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));font-size:11.5px;letter-spacing:.04em;color:var(--ivory-3);text-align:center}
@media (prefers-reduced-motion:reduce){.gate,.shake{animation:none}}
</style>
